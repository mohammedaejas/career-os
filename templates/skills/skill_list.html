<!DOCTYPE html>
<html>
<head>
    <title>My Skills | Career OS</title>
</head>
<body>
    <h1>My Skills</h1>

    <a href="{% url 'add_skill' %}">Add New Skill</a>

    {% if skills %}
        <ul>
            {% for skill in skills %}
                <li>
                    <strong>{{ skill.name }}</strong>
                    | {{ skill.category }}
                    | {{ skill.proficiency }}

                    <a href="{% url 'edit_skill' skill.id %}">Edit</a>

                    <form method="POST"
                          action="{% url 'delete_skill' skill.id %}"
                          style="display:inline;">
                        {% csrf_token %}
                        <button type="submit">Delete</button>
                    </form>
                </li>
            {% endfor %}
        </ul>
    {% else %}
        <p>You haven't added any skills yet.</p>
    {% endif %}

    <a href="/">Back to Dashboard</a>
</body>
</html>
