<!DOCTYPE html>
<html>
<head>
    <title>Edit Skill | Career OS</title>
</head>
<body>
    <h1>Edit Skill</h1>

    <form method="POST">
        {% csrf_token %}

        <label>Skill Name:</label>
        <input type="text" name="name" value="{{ skill.name }}" required>

        <br><br>

        <label>Category:</label>
        <select name="category" required>
            <option value="Technical" {% if skill.category == "Technical" %}selected{% endif %}>Technical</option>
            <option value="Soft Skill" {% if skill.category == "Soft Skill" %}selected{% endif %}>Soft Skill</option>
        </select>

        <br><br>

        <label>Proficiency:</label>
        <select name="proficiency" required>
            <option value="Beginner" {% if skill.proficiency == "Beginner" %}selected{% endif %}>Beginner</option>
            <option value="Intermediate" {% if skill.proficiency == "Intermediate" %}selected{% endif %}>Intermediate</option>
            <option value="Advanced" {% if skill.proficiency == "Advanced" %}selected{% endif %}>Advanced</option>
        </select>

        <br><br>

        <button type="submit">Update Skill</button>
    </form>

    <br>
    <a href="{% url 'skill_list' %}">Back to My Skills</a>
</body>
</html>
