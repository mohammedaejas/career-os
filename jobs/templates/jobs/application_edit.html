<!DOCTYPE html>
<html>
<head>
    <title>Edit Job Application | Career OS</title>
</head>
<body>

    <h1>Edit Job Application</h1>

    <h2>{{ application.job_role }} at {{ application.company_name }}</h2>

    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}

        <button type="submit">Update Application</button>
    </form>

    <p>
        <a href="{% url 'application_list' %}">Back to Job Applications</a>
    </p>

</body>
</html>
